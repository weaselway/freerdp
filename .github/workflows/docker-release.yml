name: Docker release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build via docker-env.sh
        run: ./docker-env.sh

      - name: Zip build artifacts
        run: |
          cd build
          zip -9 freerdp-${{ github.ref_name }}.zip *.dll sdl-freerdp.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: build/freerdp-${{ github.ref_name }}.zip
